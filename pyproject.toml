[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "calckit-kabanda"
version = "0.2.0"
description = "Arithmetic and statistics helpers: add, subtract, multiply, divide, mean, median, mode and more."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
license-files = ["LICENSE"]
authors = [{ name = "kabanda-jordan" }]
keywords = ["math", "arithmetic", "statistics", "calculator", "average", "mean"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Education",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Mathematics",
    "Typing :: Typed",
]
dependencies = ["flask>=3.0"]

[project.urls]
Homepage = "https://github.com/kabanda-jordan/calckit-kabanda"
Repository = "https://github.com/kabanda-jordan/calckit-kabanda"
Issues = "https://github.com/kabanda-jordan/calckit-kabanda/issues"
Changelog = "https://github.com/kabanda-jordan/calckit-kabanda/blob/main/CHANGELOG.md"

[project.scripts]
calckit-kabanda = "calc_toolkit.cli:main"
calc-kabanda = "calc_toolkit.webapp:main"

[tool.hatch.build.targets.wheel]
packages = ["src/calc_toolkit"]

[dependency-groups]
dev = ["pytest>=7.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]